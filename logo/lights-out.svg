<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <!-- SPDX-FileCopyrightText: 2026 Brunight <brunorodriguesricardo@gmail.com> -->
  <!-- SPDX-License-Identifier: GPL-3.0-or-later -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3160"/>
      <stop offset="1" stop-color="#141729"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ec8ff"/>
      <stop offset="1" stop-color="#8f6bff"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="1" stop-color="#c9cfdb"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="98" cy="30" r="13" fill="#fff"/>
      <circle cx="105" cy="24" r="11" fill="#000"/>
    </mask>
  </defs>

  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#sky)"/>

  <!-- moon and stars -->
  <rect x="80" y="12" width="36" height="36" fill="#ffd977" mask="url(#crescent)"/>
  <circle cx="30" cy="22" r="1.6" fill="#fff" opacity=".85"/>
  <circle cx="58" cy="16" r="1.2" fill="#fff" opacity=".7"/>
  <circle cx="70" cy="32" r="1" fill="#fff" opacity=".6"/>
  <circle cx="18" cy="38" r="1" fill="#fff" opacity=".55"/>

  <!-- lit monitor -->
  <g>
    <rect x="12" y="52" width="50" height="36" rx="4" fill="url(#bezel)"/>
    <rect x="15.5" y="55.5" width="43" height="29" rx="1.5" fill="url(#lit)"/>
    <path d="M15.5 74 L32 63 L44 71 L58.5 62 V84.5 H15.5 Z" fill="#fff" opacity=".18"/>
    <rect x="33" y="88" width="8" height="8" fill="#c9cfdb"/>
    <rect x="26" y="96" width="22" height="4" rx="2" fill="url(#bezel)"/>
  </g>

  <!-- monitor with the lights out -->
  <g>
    <rect x="66" y="52" width="50" height="36" rx="4" fill="url(#bezel)"/>
    <rect x="69.5" y="55.5" width="43" height="29" rx="1.5" fill="#000"/>
    <rect x="87" y="88" width="8" height="8" fill="#c9cfdb"/>
    <rect x="80" y="96" width="22" height="4" rx="2" fill="url(#bezel)"/>
  </g>
</svg>
